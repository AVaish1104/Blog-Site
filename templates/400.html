{% extends "base.html" %}
{% block title %}Bad request · {{ publication.name }}{% endblock %}
{% block robots %}<meta name="robots" content="noindex">{% endblock %}
{% block content %}
<div class="wrap error-page">
  <p class="error-page__code">400 — BAD REQUEST</p>

</div>
{% endblock %}
