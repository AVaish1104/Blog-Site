[project]
name = "marginalia-blog"
version = "1.0.0"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Vercel installs from this list).
dependencies = [
    "Django==5.2.18",
    "argon2-cffi==25.1.0",
    "dj-database-url==3.1.2",
    "django-axes==8.3.1",
    "django-csp==4.0",
    "markdown-it-py==4.2.0",
    "nh3==0.3.7",
    "pillow==12.3.0",
    "python-dotenv==1.2.4",
    "whitenoise==6.12.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not e2e'"
markers = ["e2e: browser tests (require Playwright; run with -m e2e)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"config/settings*.py" = ["S105"]
"apps/blog/demo_content.py" = ["E501"]
"apps/blog/management/commands/seed_demo.py" = ["S311"]  # decorative artwork, not security
